# Short Windows build check, independent of Cemu's long vcpkg bootstrap.
name: Validate Cemu Native GamePad C++ Bridge

on:
  workflow_dispatch:
  push:
    branches:
      - feature/cemu-native-remote-gamepad-usb
    paths:
      - 'remote-gamepad/native/**'
      - '.github/workflows/build-cemu-remote-syntax.yml'

permissions:
  contents: read

jobs:
  compile-bridge:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare MSVC
        uses: ilammy/msvc-dev-cmd@v1
      - name: Compile C++20 bridge against Renderer API stub
        shell: pwsh
        run: |
          $stubDir = 'remote-gamepad/native/tests/stubs'
          $srcDir = 'remote-gamepad/native'
          & cl /nologo /std:c++20 /EHsc /W4 "/I$stubDir" "/I$srcDir" /c "$srcDir/tests/bridge_compile.cpp"
          if ($LASTEXITCODE -ne 0) { throw 'MSVC C++20 bridge compilation failed.' }
