# Build the Android viewer. The Windows native bridge has a separate workflow.
name: Build Cemu Native USB GamePad Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/cemu-native-remote-gamepad-usb
    paths:
      - 'remote-gamepad/android/**'
      - '.github/workflows/build-cemu-remote-android.yml'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out GamePad source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile debug APK
        run: gradle --no-daemon -p remote-gamepad/android :app:assembleDebug
      - name: Upload GamePad APK
        uses: actions/upload-artifact@v4
        with:
          name: Cemu-Remote-GamePad-USB-Android-APK
          path: remote-gamepad/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
