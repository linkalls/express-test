# Build the Android viewer. The Windows native bridge has a separate workflow.
name: Build Cemu Native USB GamePad Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/cemu-native-remote-gamepad-usb
    paths:
      - 'remote-gamepad/android/**'
      - '.github/workflows/build-cemu-remote-android.yml'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out GamePad source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Ubuntu runners ship with Android SDK command-line tools already.
      # The old setup-android action invokes the removed "tools" package.
      - name: Install Android SDK 36
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK cmdline-tools not found in $SDK_ROOT"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile debug APK
        run: gradle --no-daemon -p remote-gamepad/android :app:assembleDebug
      - name: Upload GamePad APK
        uses: actions/upload-artifact@v4
        with:
          name: Cemu-Remote-GamePad-USB-Android-APK
          path: remote-gamepad/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
